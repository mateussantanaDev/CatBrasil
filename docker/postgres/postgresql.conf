# -----------------------------
# PostgreSQL 16: perfil conservador para VPS pequena.
# Ajuste após medir RAM, CPU, conexões e latência de disco reais.
# -----------------------------

# Conexões & Concorrência
listen_addresses = '*'
max_connections = 100
superuser_reserved_connections = 3

# Limites compatíveis com o container de 1 GiB; work_mem vale por operação.
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB

# Write-Ahead Logging (WAL) & Transações ACID
wal_level = replica
synchronous_commit = on               # Confirmação de pagamento exige WAL durável.
fsync = on
full_page_writes = on
wal_buffers = 16MB
min_wal_size = 80MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9

# Query Planner Cost Constants (SSD NVMe)
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200

# Número conservador de workers para VPS compartilhada.
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# Localização & Codificação
lc_messages = 'C'
# A imagem Alpine não garante locale pt_BR; formatar moeda na aplicação.
lc_time = 'pt_BR.utf8'
default_text_search_config = 'pg_catalog.portuguese'
