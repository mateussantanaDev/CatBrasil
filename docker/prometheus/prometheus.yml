global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: catbrasil-api
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets: ["backend-api:8080"]

  - job_name: catbrasil-host
    static_configs:
      - targets: ["node-exporter:9100"]

  # Private address of the independent restore-proof host, generated at startup.
  - job_name: catbrasil-recovery
    file_sd_configs:
      - files: ["/tmp/recovery-targets.yml"]
        refresh_interval: 1m
