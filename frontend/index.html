<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CatBrasil · Central Operacional de Frotas</title>

    <!-- Meta Tags PWA Mobile -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffb200" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CatBrasil" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,700;14..32,800&family=Oswald:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script>
      // Registro Automático de PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('✅ [PWA] Service Worker registrado com sucesso:', reg.scope))
            .catch(err => console.warn('⚠️ [PWA] Falha ao registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
